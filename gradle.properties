# Use mise-managed Java for Gradle
# This ensures Windsurf/IDEs use the same Java version as CLI
org.gradle.java.home=/Users/verlyn13/.local/share/mise/installs/java/temurin-21.0.9+10.0.LTS

# Performance settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Reduce Gradle memory footprint
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true
